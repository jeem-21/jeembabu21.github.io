<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title>
<style>
body{margin:0;background:#08111b;color:#eef5f8;font-family:system-ui}.wrap{max-width:900px;margin:auto;padding:25px 16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.box{background:#111d29;border:1px solid #293b4b;border-radius:16px;padding:20px;margin:14px 0}input,textarea{width:100%;padding:12px;margin:7px 0 14px;border-radius:10px;border:1px solid #34495a;background:#0a1520;color:white;box-sizing:border-box}button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#6ee7b7;color:#061019;margin:4px}.danger{background:#ff7070}.muted{color:#9eb0bd}.item{border:1px solid #2a3c4d;border-radius:12px;padding:12px;margin:8px 0}.thumb{width:100px;height:70px;object-fit:cover;border-radius:8px}.hide{display:none}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Admin Dashboard</h1><div class="muted">সাইটের সব Content এখান থেকে নিয়ন্ত্রণ করুন</div></div><button onclick="location.href='index.html'">সাইট দেখুন</button></div>

<div id="login" class="box"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Password"><button onclick="login()">প্রবেশ করুন</button><p class="muted">ডেমো password: admin123 — প্রকাশের আগে অবশ্যই পরিবর্তন করুন।</p></div>

<div id="dash" class="hide">
<div class="box"><h2>Profile ও পরিচয়</h2><label>নাম</label><input id="name"><label>Hero লেখা</label><textarea id="hero"></textarea><label>আমার সম্পর্কে</label><textarea id="about"></textarea><label>আমার লক্ষ্য</label><textarea id="goal"></textarea><button onclick="saveBasic()">Save Changes</button></div>

<div class="box"><h2>Profile Photo</h2><input id="photo" type="file" accept="image/*"><button onclick="savePhoto()">ছবি Save করুন</button></div>

<div class="box"><h2>আমার কাজ</h2><input id="wt" placeholder="কাজের নাম"><textarea id="wd" placeholder="কাজের বিস্তারিত"></textarea><button onclick="addWork()">+ কাজ যোগ করুন</button><div id="works"></div></div>

<div class="box"><h2>Gallery</h2><input id="gallery" type="file" accept="image/*" multiple><button onclick="addGallery()">ছবি যোগ করুন</button><div id="glist"></div></div>

<div class="box"><h2>যোগাযোগের Link</h2><div id="contacts"></div><button onclick="addContact()">+ Contact যোগ করুন</button><button onclick="saveContacts()">Contacts Save করুন</button></div>

<div class="box"><h2>Data</h2><button class="danger" onclick="resetData()">সব Content Reset</button><button onclick="logout()">Logout</button></div>
</div></div>
<script>
const base={name:"Shihab Hossain",hero:"সামাজিক কাজ, নারী ও শিশু সহায়তা এবং মানুষের প্রয়োজনের সময়ে পাশে থাকার উদ্যোগ।",about:"আমি মানুষের পাশে দাঁড়াতে এবং প্রয়োজনের সময়ে সহযোগিতা করতে কাজ করি।",goal:"মানুষের উপকারে আসে—এমন কাজকে আরও সুন্দরভাবে এগিয়ে নেওয়া।",works:[{title:"নারী সহায়তা",text:"নারীদের প্রয়োজনীয় সহায়তা ও সচেতনতার উদ্যোগ।"},{title:"শিশু সহায়তা",text:"শিশুদের নিরাপত্তা ও প্রয়োজনীয় সহযোগিতার বিষয়ে কাজ।"},{title:"সামাজিক উদ্যোগ",text:"অসহায় মানুষের পাশে দাঁড়ানোর বিভিন্ন উদ্যোগ।"}],gallery:[],contacts:[{name:"Facebook",url:"#"}],profile:""};
function get(){return JSON.parse(localStorage.getItem("shihabSite")||JSON.stringify(base))}
function put(d){localStorage.setItem("shihabSite",JSON.stringify(d));render()}
function login(){if(document.getElementById("pw").value==="admin123"){sessionStorage.admin="1";show()}else alert("Password ভুল")}
function show(){document.getElementById("login").classList.add("hide");document.getElementById("dash").classList.remove("hide");render()}
function logout(){sessionStorage.removeItem("admin");location.reload()}
function render(){if(!sessionStorage.admin)return;let d=get();name.value=d.name;hero.value=d.hero;about.value=d.about;goal.value=d.goal;
works.innerHTML=d.works.map((x,i)=>`<div class=item><b>${x.title}</b><br><span class=muted>${x.text}</span><br><button class=danger onclick="delWork(${i})">Delete</button></div>`).join("");
glist.innerHTML=d.gallery.map((x,i)=>`<div class=item><img class=thumb src="${x}"><button class=danger onclick="delImg(${i})">Delete</button></div>`).join("");
contacts.innerHTML=d.contacts.map((x,i)=>`<div class=item><input class=cn value="${x.name}" data-i="${i}"><input class=cu value="${x.url}" data-i="${i}"><button class=danger onclick="delContact(${i})">Delete</button></div>`).join("")}
function saveBasic(){let d=get();d.name=name.value;d.hero=hero.value;d.about=about.value;d.goal=goal.value;put(d);alert("Saved")}
function addWork(){let d=get();if(!wt.value.trim())return;d.works.push({title:wt.value,text:wd.value});wt.value="";wd.value="";put(d)}
function delWork(i){let d=get();d.works.splice(i,1);put(d)}
function readFile(f){return new Promise(r=>{let x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})}
async function savePhoto(){let f=photo.files[0];if(!f)return;let d=get();d.profile=await readFile(f);put(d);alert("Photo saved")}
async function addGallery(){let d=get();for(let f of gallery.files)d.gallery.push(await readFile(f));gallery.value="";put(d)}
function delImg(i){let d=get();d.gallery.splice(i,1);put(d)}
function addContact(){let d=get();d.contacts.push({name:"New Link",url:"#"});put(d)}
function saveContacts(){let d=get();document.querySelectorAll(".cn").forEach(e=>d.contacts[e.dataset.i].name=e.value);document.querySelectorAll(".cu").forEach(e=>d.contacts[e.dataset.i].url=e.value);put(d);alert("Contacts saved")}
function delContact(i){let d=get();d.contacts.splice(i,1);put(d)}
function resetData(){if(confirm("সব Content মুছে ফেলবেন?")){localStorage.removeItem("shihabSite");location.reload()}}
if(sessionStorage.admin)show();
</script></body></html>
